# Nightly rebuild of the recommender's history.
#
# The 30-day extract is baked at build time, so without this the screen freezes
# at whatever day it was last deployed — and does so silently: the page still
# loads, the recommendations still render, they are just increasingly stale.
#
# Netlify's own scheduled builds are a paid feature; a build hook plus this is
# the free equivalent.
#
# SETUP (one time, after the site exists):
#   For EACH site (the recommender, and the Virtual Cab Finder):
#   1. Netlify -> Site configuration -> Build & deploy -> Build hooks
#      -> Add build hook, name it "nightly", branch main. Copy the URL.
#   2. GitHub -> this repo -> Settings -> Secrets and variables -> Actions
#      -> New repository secret. Name it NETLIFY_BUILD_HOOK for the recommender,
#         VCF_BUILD_HOOK for the Virtual Cab Finder. Paste the URL as the value.
#
# Until step 2 is done this workflow exits cleanly with a note rather than
# failing every night and mailing you about it.

name: nightly rebuild

on:
  schedule:
    # 17:40 UTC = 23:10 IST. GitHub cron is always UTC. Late enough that the
    # day's trips have settled in Metabase, early enough that a failure is
    # visible before the morning wave.
    - cron: '40 17 * * *'
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Netlify build hook
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          VCF_HOOK: ${{ secrets.VCF_BUILD_HOOK }}
        run: |
          fired=0
          # --fail so an HTTP error is a failed job rather than a silent no-op;
          # the whole point of this file is that a stale build gets noticed.
          if [ -n "$HOOK" ]; then
            curl --fail --silent --show-error -X POST -d '{}' "$HOOK"
            echo "recommender build triggered"; fired=1
          else
            echo "NETLIFY_BUILD_HOOK not set — recommender history will go stale"
          fi
          # The Virtual Cab Finder lives in another repo but has the same
          # problem and no scheduler of its own: its 30-day window is baked at
          # build time, so with nothing triggering it the data freezes — which is
          # exactly the failure that made us abandon the Google Sheet.
          # Pinging it from here beats standing up Actions in a second repo.
          if [ -n "$VCF_HOOK" ]; then
            curl --fail --silent --show-error -X POST -d '{}' "$VCF_HOOK"
            echo "VCF build triggered"; fired=1
          else
            echo "VCF_BUILD_HOOK not set — the Virtual Cab Finder's 30-day data will go stale"
          fi
          [ "$fired" = 1 ] || echo "nothing configured yet; see the notes at the top of this file"
